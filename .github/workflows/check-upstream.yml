name: Check Upstream MemPalace Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST=$(gh api repos/MemPalace/mempalace/releases/latest --jq '.tag_name')
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare with current version
        id: compare
        run: |
          CURRENT=$(cat UPSTREAM_VERSION)
          LATEST="${{ steps.upstream.outputs.tag }}"
          echo "current=$CURRENT, latest=$LATEST"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and trigger rebuild
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.tag }}" > UPSTREAM_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_VERSION
          git commit -m "chore: bump MemPalace to ${{ steps.upstream.outputs.tag }}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
